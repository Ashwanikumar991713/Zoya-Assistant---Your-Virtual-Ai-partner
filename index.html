<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A0C10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Virtual Companion" />
    <meta name="application-name" content="Your Virtual Companion" />
    <meta name="description" content="Your personalized interactive AI voice companion." />
    <meta property="og:title" content="Your Virtual Companion" />
    <meta property="og:description" content="Your personalized interactive AI voice companion." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Your Virtual Companion</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:#0A0C10;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#ffffff;text-align:center;padding:24px;user-select:none;transition:opacity 0.4s ease;">
        <div style="font-size:22px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;background:linear-gradient(135deg,#ffffff 0%,#e2e8f0 40%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;">
          Your Virtual Companion
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:0.08em;margin-bottom:20px;">
          Starting...
        </div>
        <div style="width:48px;height:3px;border-radius:99px;background:linear-gradient(90deg,#ec4899,#8b5cf6,#06b6d4);opacity:0.85;"></div>
      </div>
    </div>
    <script>
      // Immediate safety dismiss: never let splash get stuck on screen
      (function() {
        function removeSplash() {
          var s = document.getElementById('initial-splash');
          if (s) {
            s.style.opacity = '0';
            s.style.pointerEvents = 'none';
            setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 400);
          }
        }
        // Dismiss quickly if page is loaded or after max 800ms
        if (document.readyState === 'complete') {
          setTimeout(removeSplash, 100);
        } else {
          window.addEventListener('load', removeSplash);
          setTimeout(removeSplash, 800);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
