<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1118"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="256" r="160" fill="#8B5CF6" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Elegant AI Accent Sparkle at top -->
  <path d="M256 128 C256 150 270 164 292 164 C270 164 256 178 256 200 C256 178 242 164 220 164 C242 164 256 150 256 128 Z" fill="url(#glowGrad)"/>
  <circle cx="256" cy="164" r="3.5" fill="#FFFFFF"/>

  <!-- Text: YOUR -->
  <text x="256" y="248" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="24" 
        font-weight="600" 
        letter-spacing="9" 
        text-anchor="middle" 
        fill="#94A3B8">
    YOUR
  </text>

  <!-- Text: VIRTUAL -->
  <text x="256" y="302" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="url(#textGrad)">
    VIRTUAL
  </text>

  <!-- Text: COMPANION -->
  <text x="256" y="354" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="40" 
        font-weight="800" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="url(#glowGrad)">
    COMPANION
  </text>

  <!-- Glowing Accent Line -->
  <rect x="206" y="388" width="100" height="3" rx="1.5" fill="url(#glowGrad)" opacity="0.8"/>
</svg>
