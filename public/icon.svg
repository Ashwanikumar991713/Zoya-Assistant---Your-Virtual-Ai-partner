<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  
  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#ec4899" opacity="0.15" filter="url(#glowEffect)"/>

  <!-- Orbital Rings (Atmospheric AI Pulse) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="740 180" opacity="0.85"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-dasharray="350 200" opacity="0.6"/>

  <!-- Core Glow Sphere -->
  <circle cx="256" cy="256" r="92" fill="#141724" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Companion Heart / Sparkle Motif -->
  <path d="M256 180 C256 222 282 248 316 256 C282 264 256 290 256 332 C256 290 230 264 196 256 C230 248 256 222 256 180 Z" fill="url(#starGrad)" filter="url(#glowEffect)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Audio Wave Radiance -->
  <line x1="148" y1="256" x2="164" y2="256" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <line x1="348" y1="256" x2="364" y2="256" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
</svg>
